type User {
  id: ID!
  name: String!
  phoneNumber: String!
  password: String!
  createdAt: String!
  role: UserType!
}
type Restaurant {
  id: ID!
  name: String!
  description: String!
  address: String!
  type: RestaurantType!
  openingHours: OpeningHours!
  phoneNumber: String!
  email: String!
  rating: Float
  imageUrl: String
  isActive: Boolean
  createdAt: String!
  updatedAt: String!
}
type MenuItem {
  id: ID!
  name: String!
  description: String
  price: Float!
  restaurantId: ID!
  imageUrl: String
  category: String! # Add category field
  createdAt: String
  updatedAt: String
}

enum UserType {
  deliverer
  customer
  admin
  guest
}

enum RestaurantType {
  RESTAURANT
  BOULANGERIE
  EXPRESS
}

type OpeningHours {
  monday: DailyHours!
  tuesday: DailyHours!
  wednesday: DailyHours!
  thursday: DailyHours!
  friday: DailyHours!
  saturday: DailyHours!
  sunday: DailyHours!
}

type DailyHours {
  open: String!
  close: String!
}

type Order {
  id: ID!
  restaurantId: ID!
  userId: ID!
  user: User
  items: [OrderItem]!
  totalAmount: Float!
  deliveryAddress: String
  instructions: String
  status: OrderStatus!
  createdAt: String!
  updatedAt: String!
}

type OrderItem {
  menuItemId: ID!
  quantity: Int!
  price: Float!
}

enum OrderStatus {
  Pending
  PREPARING
  DELIVERING
  COMPLETED
  CANCELLED
}

type Deliverer {
  userId: ID!
  user: User
  vehicleId: ID
  isAvailable: Boolean!
  currentLocation: String
  zone: String
  profilePicture: String
  isActive: Boolean!
  isVerified: Boolean!
}

type Query {
  users: [User!]!
  user(id: ID!): User
  restaurants: [Restaurant!]!
  restaurant(id: ID!): Restaurant
  searchRestaurants(query: String!): [Restaurant!]!
  menuItems(restaurantId: ID!): [MenuItem!]!
  allMenuItems: [MenuItem!]!
  orders(userId: ID, restaurantId: ID, status: String): [Order!]!
  order(id: ID!): Order
  deliverer(id: ID!): Deliverer
  delivererByUserId(userId: ID!): Deliverer
  allDeliverers: [Deliverer!]!
  availableDeliverers: [Deliverer!]!
  restaurantByEmail(email: String!): Restaurant
}

type Mutation {
  createUser(input: CreateUserInput!): User!
  updateUser(id: ID!, input: UpdateUserInput!): User!
  createRestaurant(input: CreateRestaurantInput!): Restaurant!
  updateRestaurant(id: ID!, input: UpdateRestaurantInput!): Restaurant!
  deleteRestaurant(id: ID!): Boolean!
  addMenuItem(input: AddMenuItemInput!): MenuItem!
  updateMenuItem(id: ID!, input: UpdateMenuItemInput!): MenuItem!
  createOrder(input: OrderInput!): Order!
  updateOrderStatus(id: ID!, status: OrderStatus!): Order!
  createDeliverer(input: CreateDelivererInput!): Deliverer!
  updateDelivererStatus(id: ID!, isAvailable: Boolean!): Deliverer!
  updateDelivererLocation(id: ID!, location: String!): Deliverer!
}

input CreateUserInput {
  name: String!
  phoneNumber: String!
  role: UserType!
}

input UpdateUserInput {
  name: String
  phoneNumber: String
  password: String
  role: UserType
}

input CreateRestaurantInput {
  name: String!
  description: String!
  address: String!
  type: RestaurantType!
  openingHours: OpeningHoursInput!
  phoneNumber: String!
  email: String!
  imageUrl: String
  isActive: Boolean
}

input UpdateRestaurantInput {
  name: String
  description: String
  address: String
  type: RestaurantType
  openingHours: OpeningHoursInput
  phoneNumber: String
  email: String
  imageUrl: String
  isActive: Boolean
}

input OpeningHoursInput {
  monday: DailyHoursInput!
  tuesday: DailyHoursInput!
  wednesday: DailyHoursInput!
  thursday: DailyHoursInput!
  friday: DailyHoursInput!
  saturday: DailyHoursInput!
  sunday: DailyHoursInput!
}

input DailyHoursInput {
  open: String!
  close: String!
}

input AddMenuItemInput {
  name: String!
  description: String
  price: Float!
  restaurantId: ID!
  category: String!
  imageUrl: String
}

input UpdateMenuItemInput {
  name: String
  description: String
  price: Float
  category: String
  isAvailable: Boolean
}

input OrderInput {
  restaurantId: ID!
  userId: ID!
  items: [OrderItemInput!]!
  totalAmount: Float!
  deliveryAddress: String
  instructions: String
  status: OrderStatus
}

input OrderItemInput {
  menuItemId: ID!
  quantity: Int!
}

input CreateDelivererInput {
  vehicleId: ID
  isAvailable: Boolean
  currentLocation: String
  zone: String
  profilePicture: String
}
