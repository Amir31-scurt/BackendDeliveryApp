type User {
  id: ID!
  name: String!
  phoneNumber: String!
  password: String!
  createdAt: String!
  role: UserType!
  profilePicture: String
}
type Restaurant {
  id: ID!
  name: String!
  description: String!
  address: String!
  type: RestaurantType!
  openingHours: OpeningHours!
  phoneNumber: String!
  email: String!
  rating: Float
  totalRatings: Int!
  ratings: [RestaurantRating!]
  averageRating: Float
  feedbacks: [Feedback]
  imageUrl: String
  isActive: Boolean
  latitude: Float
  longitude: Float
  distance: Float
  createdAt: String!
  updatedAt: String!
}
type MenuItem {
  id: ID!
  name: String!
  description: String
  price: Float!
  restaurantId: ID!
  imageUrl: String
  category: String! # Add category field
  isAvailable: Boolean
  createdAt: String
  updatedAt: String
}

type Feedback {
  note: String
  userId: ID
  rating: Float!,
  userName: String
  createdAt: String
}

enum UserType {
  deliverer
  customer
  admin
  guest
}

enum RestaurantType {
  RESTAURANT
  BOULANGERIE
  EXPRESS
}

type OpeningHours {
  monday: DailyHours!
  tuesday: DailyHours!
  wednesday: DailyHours!
  thursday: DailyHours!
  friday: DailyHours!
  saturday: DailyHours!
  sunday: DailyHours!
}

type Address {
  address: String!
  latitude: Float!
  longitude: Float!
}

type DailyHours {
  open: String!
  close: String!
}

type Order {
  id: ID!
  restaurantId: ID!
  userId: ID!
  user: User
  restaurant: Restaurant
  items: [OrderItem]!
  totalAmount: Float!
  productsTotal: Float     
  deliveryFee: Float       
  serviceFee: Float        

  restaurantPayout: Float  
  delivererPayout: Float   
  gourmetPayout: Float     

  payoutStatus: String
  payoutItems: [PayoutItem]       
  deliveryAddress: Address
  instructions: String
  note: String
  rating: Float
  delivererRating: Float
  delivererRatingComment: String
  status: OrderStatus!
  isPaid: Boolean!
  paymentMethod: PaymentMethod!
  createdAt: String!
  updatedAt: String!
  delivererId: ID
  deliverer: Deliverer
}

type PayoutItem {
  id: ID!
  batchId: String!
  payoutId: String
  targetType: String!
  targetId: ID!
  receiveAmount: Float!
  fee: Float
  status: String!
  errorCode: String
  errorMessage: String
  createdAt: String!
}
type PayoutBatch {
  batchId: String!
  payouts: [PayoutItem!]!
}

type OrderItem {
  menuItemId: ID!
  menuItem: MenuItem
  quantity: Int!
  price: Float!
}

type PayoutSummary {
  totalPayouts: Float!
  totalRestaurant: Float!
  totalDeliverer: Float!
  totalSucceeded: Int!
  totalFailed: Int!
}

type RestaurantPayoutSummary {
  restaurantId: ID!
  restaurantName: String!
  totalPayout: Float!
  lastPayoutAt: String
}

type DelivererPayoutSummary {
  delivererId: ID!
  delivererName: String!
  totalPayout: Float!
  lastPayoutAt: String
}

type DelivererStats {
  todayEarnings: Float!
  todayDeliveries: Int!
  totalEarnings: Float!
  totalDeliveries: Int!
}


enum OrderStatus {
  Pending
  PREPARING
  READY
  DELIVERING
  COMPLETED
  CANCELLED
}

enum PaymentMethod {
  CASH
  ORANGE_MONEY
  WAVE
}

type Deliverer {
  userId: ID!
  user: User
  vehicleId: ID
  isAvailable: Boolean!
  currentLocation: Address
  zone: String
  profilePicture: String
  isActive: Boolean!
  isVerified: Boolean!
  averageRating: Float
  totalRatings: Int
}

type Notification {
  id: ID!
  userId: ID!
  title: String!
  body: String!
  read: Boolean!
  createdAt: String!
}

type RestaurantRating {
  id: ID!
  restaurantId: ID!
  userId: ID!
  user: User
  rating: Float!
  comment: String
  createdAt: String!
  updatedAt: String!
}

type Query {
  users: [User!]!
  user(id: ID, phoneNumber: String): User
  restaurants: [Restaurant!]!
  restaurant(id: ID!): Restaurant
  searchRestaurants(query: String!): [Restaurant!]!
  restaurantsNearby(latitude: Float!, longitude: Float!, maxDistance: Float): [Restaurant!]!
  menuItems(restaurantId: ID!): [MenuItem!]!
  menuItem(id: ID!): MenuItem
  allMenuItems: [MenuItem!]!
  orders(userId: ID, restaurantId: ID, status: String, delivererId: ID): [Order!]!
  order(id: ID!): Order
  deliverer(userId: ID!): Deliverer
  delivererByUserId(userId: ID!): Deliverer
  allDeliverers: [Deliverer!]!
  availableDeliverers: [Deliverer!]!
  restaurantByEmail(email: String!): Restaurant
  notifications(userId: ID!): [Notification!]!
  restaurantRatings(restaurantId: ID!): [RestaurantRating!]!
  userRestaurantRating(restaurantId: ID!, userId: ID!): RestaurantRating
  delivererStats(delivererId: ID!): DelivererStats!

  payoutStatusByOrder(orderId: ID!): [PayoutItem!]!       # OK
  payoutStatusByBatch(batchId: String!): PayoutBatch       # OK

  restaurantPayouts(restaurantId: ID!): [PayoutItem!]!     # optional
  delivererPayouts(delivererId: ID!): [PayoutItem!]!       # OK

  payoutsAdmin(
    status: String
    targetType: String
    limit: Int
    offset: Int
  ): [PayoutItem!]!                                        # OK

  payoutsSummaryGlobal: PayoutSummary                      # optional
  payoutsSummaryRestaurants: [RestaurantPayoutSummary]     # optional
  payoutsSummaryDeliverers: [DelivererPayoutSummary]       # optional
  payoutItems(orderId: ID!): [PayoutItem!]!
  payoutStatus(orderId: ID!): String!
}

type Mutation {
  createUser(input: CreateUserInput!): User!
  updateUser(id: ID!, input: UpdateUserInput!): User!
  createRestaurant(input: CreateRestaurantInput!): Restaurant!
  updateRestaurant(id: ID!, input: UpdateRestaurantInput!): Restaurant!
  deleteRestaurant(id: ID!): Boolean!
  addMenuItem(input: AddMenuItemInput!): MenuItem!
  updateMenuItem(id: ID!, input: UpdateMenuItemInput!): MenuItem!
  deleteMenuItem(id: ID!): Boolean!
  createOrder(input: OrderInput!): Order!
  updateOrderStatus(id: ID!, status: OrderStatus!): Order!
  createDeliverer(input: CreateDelivererInput!): Deliverer!
  updateDelivererStatus(userId: ID!, isAvailable: Boolean!): Deliverer!
  updateDelivererLocation(userId: ID!, location: LocationInput!): Deliverer!
  updateDeliverer(userId: ID!, input: UpdateDelivererInput!): Deliverer!
  deleteUser(id: ID!): Boolean!
  markNotificationAsRead(id: ID!): Notification!
  markAllNotificationsAsRead(userId: ID!): Boolean!
  deleteNotification(id: ID!): Boolean!
  confirmOrderDelivery(orderId: ID!, token: String!, delivererId: ID!): Order!
  manualConfirmDelivery(orderId: ID!, delivererId: ID!): Order!
  addRestaurantRating(input: RestaurantRatingInput!): RestaurantRating!
  updateRestaurantRating(id: ID!, input: UpdateRestaurantRatingInput!): RestaurantRating!
  deleteRestaurantRating(id: ID!): Boolean!
  updateOrderNote(orderId: ID!, note: String!): Order!
  updateOrderRating(orderId: ID!, rating: Float!): Order!
  updateOrderFeedback(orderId: ID!, rating: Float!, note: String!): Order!
  rateOrderComplete(input: CompleteOrderRatingInput!): Order!
  deleteOrder(id: ID!): Order!
  retryPayout(orderId: ID!): Boolean!
  retryFailedPayout(payoutItemId: ID!): Boolean!
}

input CreateUserInput {
  name: String!
  phoneNumber: String!
  role: UserType!
}

input LocationInput {
  address: String!
  latitude: Float!
  longitude: Float!
}

input UpdateUserInput {
  name: String
  password: String
  profilePicture: String
}

input UpdateDelivererInput {
  vehicleId: ID
  zone: String
  profilePicture: String
}

input CreateRestaurantInput {
  name: String!
  description: String!
  address: String!
  type: RestaurantType!
  openingHours: OpeningHoursInput!
  phoneNumber: String!
  email: String!
  imageUrl: String
  isActive: Boolean
  latitude: Float
  longitude: Float
}

input UpdateRestaurantInput {
  name: String
  description: String
  address: String
  type: RestaurantType
  openingHours: OpeningHoursInput
  phoneNumber: String
  email: String
  imageUrl: String
  isActive: Boolean
  latitude: Float
  longitude: Float
}

input OpeningHoursInput {
  monday: DailyHoursInput!
  tuesday: DailyHoursInput!
  wednesday: DailyHoursInput!
  thursday: DailyHoursInput!
  friday: DailyHoursInput!
  saturday: DailyHoursInput!
  sunday: DailyHoursInput!
}

input DailyHoursInput {
  open: String!
  close: String!
}

input AddMenuItemInput {
  name: String!
  description: String
  price: Float!
  restaurantId: ID!
  category: String!
  imageUrl: String
}

input UpdateMenuItemInput {
  name: String
  description: String
  price: Float
  category: String
  imageUrl: String
  isAvailable: Boolean
}

input OrderInput {
  restaurantId: ID!
  userId: ID!
  items: [OrderItemInput!]!
  totalAmount: Float!
  deliveryAddress: AddressInput!
  instructions: String
  note: String
  status: OrderStatus
  isPaid: Boolean
  paymentMethod: PaymentMethod
  delivererId: ID!
}

input AddressInput {
  address: String!
  latitude: Float!
  longitude: Float!
}

input OrderItemInput {
  menuItemId: ID!
  quantity: Int!
}

input CreateDelivererInput {
  vehicleId: ID
  isAvailable: Boolean
  currentLocation: String
  zone: String
  profilePicture: String
}

input RestaurantRatingInput {
  restaurantId: ID!
  userId: ID!
  rating: Float!
  comment: String
}

input UpdateRestaurantRatingInput {
  rating: Float
  comment: String
}

input CompleteOrderRatingInput {
  orderId: ID!
  restaurantRating: Float!
  restaurantComment: String
  delivererRating: Float!
  delivererComment: String
}
